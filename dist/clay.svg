<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">Seated knee extension, a clay study</title>
<desc id="desc">A terracotta figure in a pine-green jersey sits on an ochre block with one knee extended and the other leg resting.</desc>
<defs>
  <radialGradient id="stage" cx=".45" cy=".3" r=".83"><stop stop-color="#fff5dc"/><stop offset="1" stop-color="#ebd9b9"/></radialGradient>
  <linearGradient id="earth" x2=".4" y2="1"><stop stop-color="#e7a47e"/><stop offset=".27" stop-color="#d98660"/><stop offset=".7" stop-color="#c36a4b"/><stop offset="1" stop-color="#9b4938"/></linearGradient>
  <radialGradient id="skin" cx=".31" cy=".23" r=".85"><stop stop-color="#f3b793"/><stop offset=".4" stop-color="#df916e"/><stop offset=".8" stop-color="#c67757"/><stop offset="1" stop-color="#a95842"/></radialGradient>
  <linearGradient id="jersey" x2=".65" y2="1"><stop stop-color="#789784"/><stop offset=".32" stop-color="#587f6a"/><stop offset=".78" stop-color="#3e6656"/><stop offset="1" stop-color="#345544"/></linearGradient>
  <linearGradient id="shorts" x2=".27" y2="1"><stop stop-color="#705b4e"/><stop offset=".44" stop-color="#57483e"/><stop offset="1" stop-color="#3c342d"/></linearGradient>
  <linearGradient id="brick" x2=".25" y2="1"><stop stop-color="#e5b569"/><stop offset=".6" stop-color="#d9a459"/><stop offset="1" stop-color="#ba8845"/></linearGradient>
  <linearGradient id="shoe" x2=".3" y2="1"><stop stop-color="#f7e7c4"/><stop offset=".6" stop-color="#ebce9f"/><stop offset="1" stop-color="#c7a57d"/></linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".67" numOctaves="3" stitchTiles="stitch"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="soft"><feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#5e3a27" flood-opacity=".22"/></filter>
</defs>
<rect width="600" height="420" fill="url(#stage)"/>
<!-- Stamped registration marks and a lightly scratched motion arc. -->
<g fill="none" stroke="#a48868" stroke-opacity=".52" stroke-width="1.3">
  <path d="M26 43V26h17m514 0h17v17M26 376v17h17m514 0h17v-17"/>
  <path d="M373 348Q459 313 491 239" stroke-dasharray="3 7"/>
  <path d="m481 245 12-11 2 16"/>
</g>
<g filter="url(#blur)" fill="#765235" opacity=".22"><ellipse cx="267" cy="360" rx="134" ry="12"/><ellipse cx="460" cy="363" rx="61" ry="5" opacity=".45"/></g>
<!-- Thumb-pressed block. -->
<path d="M151 237q0-6 8-9l43-15 101 6q7 0 7 8l-1 111q0 5-7 8l-41 17-103-7q-7 0-7-8z" fill="#ae7e43"/>
<path d="m154 235 46-16q4-2 11-1l93 5-47 18z" fill="#efc881"/>
<path d="M151 237q0-4 5-4l99 6q8 1 8 7l-1 111q0 7-6 6l-99-7q-6 0-6-8z" fill="url(#brick)"/>
<path d="M160 242q38 1 86 5m-89 100 19 2" stroke="#f9d895" opacity=".45" stroke-width="3" fill="none" stroke-linecap="round"/>
<!-- Far leg rests while the near leg extends. -->
<g filter="url(#soft)">
<path d="M222 205q22-4 48 3l51 10q15 3 16 13 0 16-20 18l-73-9q-36-4-41-17z" fill="#a75e47"/>
<path d="M319 228q14-5 17 10l-7 81q-1 14-14 13-13-1-13-18l3-64q0-17 14-22z" fill="#ba7658"/>
<path d="M303 318q12 5 26 0l2 15q14 7 22 14 5 6 0 11-8 7-44 0-13-2-13-9z" fill="url(#shoe)"/>
<path d="M297 349q20 8 56 5" fill="none" stroke="#ad9071" stroke-width="4" stroke-linecap="round"/>
<path d="M193 186q18-11 44-6l45 17 25 4q11 1 15 9l-6 25q-19 4-43 0l-51-2q-24 1-35-9-14-14 6-38z" fill="url(#shorts)"/>
<path d="M299 203q23-2 40 3 17 5 14 18-3 13-20 15l-36-2q4-15 2-34z" fill="url(#earth)"/>
<path d="M349 212q19-4 43-11l49-15q13-3 17 7 5 10-6 17l-67 27q-26 10-40-1-13-12 4-24z" fill="url(#skin)"/>
<ellipse cx="345" cy="224" rx="13" ry="14" transform="rotate(24 345 224)" fill="url(#earth)"/>
<path d="M449 184q7-4 13 0 7 7 14 9l18 4q12 3 10 13-2 8-13 9l-38-1q-9-1-12-8l-3-14z" fill="url(#shoe)"/>
<path d="M446 210q14 5 44 4 8 0 12-3" stroke="#b79871" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="m465 193 9 5m-4-8 9 5" stroke="#fff2d3" stroke-width="3" stroke-linecap="round"/>
<!-- Hand-shaped torso with slightly uneven hems. -->
<path d="M201 104q15-12 36-4 14 6 16 23l4 64q1 10 8 18-18 10-44 7l-35-5q-4-29 0-56 3-35 15-47z" fill="url(#jersey)"/>
<path d="M191 199q29 9 63 4m-61-43q-3 10-2 20" stroke="#86a18a" opacity=".6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M216 86q8-6 21 0l3 19q-11 13-26 1z" fill="url(#earth)"/>
<path d="M203 66q0-21 16-27 19-8 35 6 9 7 8 21l5 9q2 5-5 7-2 17-13 20-16 6-29-6-14-12-17-30z" fill="url(#skin)"/>
<path d="M204 78q-8-10-5-27 2-13 12-17 5-8 16-7 9-5 19 2 15-1 21 11 5 10-4 16-8 5-22 2-10-3-15 7l-6 13z" fill="url(#shorts)"/>
<path d="M206 48q7-10 18-11m2-2q13-5 22 3" fill="none" stroke="#897161" stroke-opacity=".65" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="221" cy="75" rx="6" ry="8" fill="url(#earth)"/>
<circle cx="254" cy="68" r="2" fill="#674134"/><path d="m251 88 6-1" stroke="#a6634c" stroke-width="2" stroke-linecap="round"/>
<path d="M209 118q12-6 20 3 9 14 12 42l-17 9q-16-20-23-37-4-12 8-17z" fill="url(#earth)"/>
<path d="M226 158q7-6 17-1l36 20q10 3 16 10 3 8-4 12-6 3-13-2l-5-5q-30-5-45-15-11-8-2-19z" fill="url(#skin)"/>
<path d="M202 105q14-9 24 1 7 7 12 24-12 9-27 11-10-13-14-22-2-8 5-14z" fill="url(#jersey)"/>
</g>
<g fill="none" stroke="#fff0d7" stroke-linecap="round" opacity=".34" stroke-width="1.7"><path d="M326 210q7-1 13 2m-11 1 7 1M357 219l9-2m-8 5 7-2M228 162l7-2m-5 5 5-2M205 114q4-5 8-6"/></g>
<rect width="600" height="420" filter="url(#grain)" opacity=".06" style="mix-blend-mode:multiply" pointer-events="none"/>
</svg>
